<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos+ | {% block title %} {% endblock title %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/style.css')}}">
</head>

<body>

    <header>
        <div class="container">
            <a href="{{ url_for('eventos.home') }}" class="logo">Eventos+</a>

            <nav>
                <a href="{{ url_for('eventos.home') }}">Início</a>
                <a href="{{ url_for('eventos.lista_eventos') }}">Eventos</a>
                <a href="{{ url_for('eventos.cadastrar_evento') }}">Cadastrar</a>
            </nav>
        </div>
    </header>   

    <main class="container">
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p>© 2026 Eventos+</p>
    </footer>

    <script src="{{ url_for('static', filename='/js/script.js')}}"></script>
</body>
</html>
