{% extends "base.html" %}

{% block title %}Cadastrar{% endblock title %}

{% block content %}
        <h1>Cadastrar evento</h1>
        <p class="subtitulo">Preencha os dados do evento.</p>

        <form action="{{ url_for('eventos.cadastrar_evento') }}" onsubmit="alert('Cadastrado com sucesso!')" method="POST">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" {% if formulario %} value="{{ formulario.nome }}" {% endif %} required>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" rows="4" required>{% if formulario %} {{ formulario.descricao }} {% endif %}</textarea>

            <label for="data">Data:</label>
            <input type="date" id="data" name="data" {% if formulario %} value="{{ formulario.data }}" {% endif %} required>

            <label for="local">Local:</label>
            <input type="text" id="local" name="local" {% if formulario %} value="{{ formulario.local }}" {% endif %} required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option>Selecione...</option>
                <option>Workshop</option>
                <option>Palestra</option>
                <option>Curso</option>
                <option>Conferência</option>
                <option>Feira</option>
                <option>Festival</option>
                <option>Outro</option>
            </select>

            <label for="participantes">Participantes:</label>
            <input type="number" id="participantes" name="participantes" {% if formulario %} value="{{ formulario.participantes }}" {% endif %} min="1" required>

            <div class="botoes">
                <a href="{{ url_for('eventos.lista_eventos') }}" class="botao">Cancelar</a>
                <button type="submit" class="botao">Cadastrar</button>
            </div>

            {% if erro %}
                {% for e in erro %}
                    <p>Erro: {{ e }}</p>
                {% endfor %}
            {% endif %}

        </form>

{% endblock content %}
